name: Dev Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  dev-release:
    name: Build & Publish Dev Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')

    steps:
      - name: Checkout Master Branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build in Release Mode
        run: dotnet build --no-restore --configuration Release

      - name: Publish API
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Generate Developer Release Notes from CHANGELOG.html
        id: meta
        run: python3 scripts/generate_release_notes.py

      - name: Package Release Archives
        run: |
          cd publish
          zip -r "../paymentgateway-api-${{ steps.meta.outputs.version }}.zip" .
          cd ..

      - name: Verify Docker Container Build
        run: |
          docker build \
            -t paymentgateway-api:dev \
            -t paymentgateway-api:${{ steps.meta.outputs.version }} \
            -t paymentgateway-api:${{ steps.meta.outputs.short_sha }} .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-artifacts-${{ steps.meta.outputs.version }}
          path: |
            paymentgateway-api-${{ steps.meta.outputs.version }}.zip
            CHANGELOG.html
            RELEASE_NOTES.md
          retention-days: 14

      - name: Create GitHub Dev Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "Developer Update - ${{ steps.meta.outputs.version }}: ${{ steps.meta.outputs.summary }}"
          body_path: RELEASE_NOTES.md
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            paymentgateway-api-${{ steps.meta.outputs.version }}.zip
            CHANGELOG.html
            RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
