services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - ASPNETCORE_URLS=http://+:8080
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4317
            - OTEL_SERVICE_NAME=PaymentGateway.Api
            - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-app_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SslMode=Disable;Include Error Detail=true;
            - ConnectionStrings__Redis=redis:6379,abortConnect=false
        ports:
            - 127.0.0.1:5248:8080
        restart: unless-stopped
        volumes:
            - ./configs:/app/configs:ro
    cloudflared:
        command: tunnel --no-autoupdate --logfile /app/logs/tunnel.log --url http://nginx:80
        container_name: standalone_cloudflared
        extra_hosts:
            - host.docker.internal:host-gateway
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        volumes:
            - ./logs:/app/logs
    nginx:
        depends_on:
            - api
        image: nginx:alpine
        ports:
            - 127.0.0.1:80:80
        restart: unless-stopped
        volumes:
            - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./html:/usr/share/nginx/html:ro
    otel:
        command:
            - --config=/etc/otelcol-contrib/config.yaml
        image: otel/opentelemetry-collector-contrib:latest
        ports:
            - 127.0.0.1:4317:4317
            - 127.0.0.1:4318:4318
            - 127.0.0.1:8888:8888
            - 127.0.0.1:13133:13133
        restart: unless-stopped
        volumes:
            - ./configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    postgres:
        env_file:
            - .env
        healthcheck:
            interval: 10s
            retries: 5
            start_period: 15s
            test:
                - CMD-SHELL
                - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
            timeout: 5s
        image: postgres:16-alpine
        ports:
            - 127.0.0.1:5431:5432
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    redis:
        healthcheck:
            interval: 10s
            retries: 5
            test:
                - CMD
                - redis-cli
                - ping
            timeout: 5s
        image: redis:alpine
        ports:
            - 6379:6379
        restart: unless-stopped
        volumes:
            - redis_data:/data
volumes:
    postgres_data: {}
    redis_data: {}
