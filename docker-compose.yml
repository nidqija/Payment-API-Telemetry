services:
    nginx:
        image: nginx:alpine
        ports:
            - 127.0.0.1:80:80
        restart: unless-stopped
        volumes:
            - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./html:/usr/share/nginx/html:ro
    postgres:
        env_file:
            - .env
        image: postgres:16-alpine
        ports:
            - 127.0.0.1:5431:5431
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data
    redis:
        image: redis:alpine
        ports:
            - 6379:6379
        restart: unless-stopped
        volumes:
            - redis_data:/data
volumes:
    postgres_data: {}
    redis_data: {}
