services:
    nginx:
        image: nginx:alpine
        ports:
            - 127.0.0.1:80:80
        restart: unless-stopped
        volumes:
            - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./html:/usr/share/nginx/html:ro
    redis:
        image: redis:alpine
        ports:
            - 6379:6379
        restart: unless-stopped
        volumes:
            - redis_data:/data
volumes:
    redis_data: {}
