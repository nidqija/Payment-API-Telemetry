services:
    nginx:
        image: nginx:alpine
        ports:
            - 127.0.0.1:80:80
        restart: unless-stopped
        volumes:
            - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - api


    api:
        build:
            context: .
            dockerfile: Dockerfile  
        ports:
            - "127.0.0.1:5248:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - ASPNETCORE_URLS=http://+:8080
            - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-app_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SslMode=Disable;Include Error Detail=true;
            - ConnectionStrings__Redis=redis:6379,abortConnect=false
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        env_file:
            - .env
        image: postgres:16-alpine
        ports:
            - 127.0.0.1:5431:5432
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5


        
    redis:
        image: redis:alpine
        ports:
            - 6379:6379
        restart: unless-stopped
        volumes:
            - redis_data:/data

        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: {}
    redis_data: {}
