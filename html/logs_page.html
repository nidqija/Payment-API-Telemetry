<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Deliveries</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
        .table-wrap { border: 1px solid #334155; border-radius: 8px; overflow-x: auto; background: #1e293b; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: #0f172a; color: #94a3b8; padding: 12px; border-bottom: 1px solid #334155; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #334155; vertical-align: top; }
        .status { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .status-2xx { background: #064e3b; color: #34d399; }
        .status-err { background: #7f1d1d; color: #f87171; }
        pre { margin: 0; font-family: monospace; font-size: 11px; color: #38bdf8; max-width: 350px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Webhook Deliveries (Live Polling)</h1>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Event</th>
                    <th>Target URL</th>
                    <th>Duration</th>
                    <th>Payload</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr><td colspan="6" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    
</body>
</html>
