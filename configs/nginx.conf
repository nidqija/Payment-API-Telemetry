
    # upstream block for payment api
    # this is for load balancing and reverse proxy init
    upstream payment_api {
        server api:8080;
        keepalive 32;
    }


        # server block for payment api
        # this is for load balancing and reverse proxy init
        server {
        listen 80; # listening on http default port
        server_name localhost; # the default host name is localhost

        # client max body size is 256k
        client_max_body_size 256k; 
        
        # client body timeout is 10s
        client_body_timeout 10s;

        # client header timeout is 10s
        client_header_timeout 10s;

        # proxy set header for payment api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        

        # location block for payment api
        # this is for load balancing and reverse proxy init
        location / {
          proxy_pass http://payment_api; # pass the request to the payment api
          proxy_http_version 1.1; # set the http version to 1.1 for keepalive connections
          proxy_set_header Connection ""; # set the connection to empty for keepalive connections
        }

        # this is for webhook deliveries logs page
        # this will be called when the user goes to localhost/webhooks
        # it will look into a default html folder that is prepared by nginx
        location /webhooks {
            root /usr/share/nginx/html;
            try_files /logs_page.html =404;
        }

       


        # location block for payment api
        # this is for load balancing and reverse proxy init
        location ~* ^/v1/payments/.+/invoice$ {
            proxy_pass http://payment_api; # pass the request to the payment api
            proxy_http_version 1.1; # set the http version to 1.1 for keepalive connections
            proxy_set_header Connection ""; # set the connection to empty for keepalive connections

            # set the proxy buffering settings
            proxy_buffering on; # enable proxy buffering
            proxy_buffers 8 64k; # set the proxy buffers
            proxy_busy_buffers_size 128k; # set the proxy busy buffers size
        }

    }
